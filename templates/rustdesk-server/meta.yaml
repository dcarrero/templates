name: RustDesk Server
description:
  RustDesk Server is the self-hosted backend for the RustDesk remote desktop
  client. It bundles the ID/rendezvous server (hbbs) and the relay server (hbbr)
  in a single container, so your RustDesk clients register, find each other and
  relay traffic through your own infrastructure instead of the public servers.
  Connections are end-to-end encrypted with a key pair generated on first start.
instructions:
  Secure by default - a unique random key pair is generated on first start and
  clients without it are rejected (ENCRYPTED_ONLY=1). The primary domain of the
  service is the host your RustDesk clients use (RELAY is set from it). To use
  your own domain, add it in Domains, make it primary, create a DNS A record to
  this server (DNS only, no Cloudflare proxy) and redeploy. Open ports
  21115-21117 TCP and 21116 UDP on your firewall. Optionally set
  KEY_PUB/KEY_PRIV (from `rustdesk-utils genkeypair`) to provide your own key
  pair. Read the public key with `cat /data/id_ed25519.pub` in the service
  console and enter host and key in each client under Settings > Network.
changeLog:
  - date: 2026-11-18
    description: First Release (rustdesk-server-s6 1.1.16)
links:
  - label: Website
    url: https://rustdesk.com/
  - label: Documentation
