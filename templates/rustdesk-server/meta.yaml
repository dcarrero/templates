schema:
  type: object
  required:
    - appServiceName
    - appServiceImage
  properties:
    appServiceName:
      type: string
      title: App Service Name
      default: rustdesk-server
    appServiceImage:
      type: string
      title: App Service Image
      default: rustdesk/rustdesk-server-s6:1.1.16
benefits:
  - title: Your Own Remote Access Infrastructure
    description:
      Stop depending on the public RustDesk servers. IDs, signalling and relay
      traffic stay on a server you control.
  - title: Encrypted by Default
    description:
      A key pair is generated on first start and only clients that know the
      public key can use the server (ENCRYPTED_ONLY).
  - title: One Service, All Ports
    description:
      hbbs and hbbr run together in one container with a single persistent
      volume, which keeps the deployment simple.
features:
  - title: ID / Rendezvous Server (hbbs)
    description: Registers clients and brokers peer-to-peer connections.
  - title: Relay Server (hbbr)
    description: Relays traffic when a direct connection is not possible.
  - title: Bring Your Own Keys
    description:
      Provide the key pair through the KEY_PUB and KEY_PRIV environment
      variables, or let the server generate one on first start.
  - title: Persistent Keys
    description: Keys and the peer database live in a persistent volume.
tags:
  - Remote Desktop
  - Self-Hosted
  - Security
